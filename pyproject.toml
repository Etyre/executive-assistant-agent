[project]
name = "executive-assistant-agent"
version = "0.1.0"
description = "A personal executive-assistant agent over Toggl, Focus Monitor, Oura/Sleep Bandit, exercise log and Project Tracker"
requires-python = ">=3.12"
dependencies = ["anthropic>=2.0", "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "pyyaml>=6", "python-multipart>=0.0.9", "icalendar>=6", "recurring-ical-events>=3"]

[project.optional-dependencies]
local-stt = ["faster-whisper"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
